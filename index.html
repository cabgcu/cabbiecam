<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F3F4F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <title>CABBIE CAM 📸</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background-color: #F3F4F6; 
      color: #1e293b; 
      overflow-x: hidden; 
      position: relative;
    }

    /* Vibrant Retro Floating Glows */
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
      50% { transform: translateY(-20px) scale(1.05); opacity: 1; }
    }
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .bg-glow-teal {
      position: absolute;
      top: -5%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.4) 0%, rgba(45, 212, 191, 0) 70%);
      filter: blur(40px);
      z-index: -1;
      animation: float 7s ease-in-out infinite;
    }
    .bg-glow-orange {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(251, 146, 60, 0.3) 0%, rgba(251, 146, 60, 0) 70%);
      filter: blur(40px);
      z-index: -1;
      animation: float 9s ease-in-out infinite reverse;
    }
    .bg-glow-yellow {
      position: absolute;
      top: 40%;
      left: 50%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(250, 204, 21, 0.3) 0%, rgba(250, 204, 21, 0) 70%);
      filter: blur(40px);
      z-index: -1;
      animation: float 8s ease-in-out infinite 2s;
    }

    /* Chunky Glass Panel */
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), inset 0 2px 0 rgba(255,255,255,0.8);
    }

    /* Active Mode Toggle */
    .toggle-active {
      background: #0f172a; 
      color: white;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.3);
    }

    /* Disposable Filter for the Gallery */
    .disposable-filter {
      filter: contrast(1.2) saturate(1.1) sepia(0.2) brightness(0.95) hue-rotate(-2deg);
    }

    /* Scattered Polaroid styling */
    .polaroid-card {
      background: #ffffff;
      padding: 10px 10px 24px 10px;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .polaroid-scatter:nth-child(odd) {
      transform: rotate(-3deg);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .polaroid-scatter:nth-child(even) {
      transform: rotate(4deg);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .polaroid-scatter:hover {
      transform: rotate(0deg) scale(1.05);
      z-index: 20;
    }

    .shutter-pop:active {
      transform: scale(0.9);
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-pop {
      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Ambient Glows -->
  <div class="bg-glow-teal"></div>
  <div class="bg-glow-orange"></div>
  <div class="bg-glow-yellow"></div>

  <!-- Note Popup Modal (Hidden by default) -->
  <div id="noteModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden bg-slate-900/40 backdrop-blur-sm transition-opacity">
    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 flex flex-col items-center modal-pop">
      <h3 class="text-xl font-extrabold text-slate-800 mb-1">Add a Caption</h3>
      <p class="text-slate-500 text-sm mb-5 font-semibold text-center">Write on the back of the photo before sending it to the lab! ✍️</p>
      
      <input type="text" id="modalNoteInput" maxlength="30" placeholder="Type here... (optional)" class="w-full bg-white border-2 border-slate-200 rounded-xl px-4 py-3 mb-5 text-base font-bold text-center text-slate-800 focus:outline-none focus:border-orange-400 shadow-sm">
      
      <button id="sendToLabBtn" class="w-full bg-gradient-to-br from-orange-400 to-red-500 text-white font-extrabold text-lg py-3.5 rounded-xl shadow-[0_6px_20px_rgba(239,68,68,0.3)] active:scale-95 transition-transform flex justify-center items-center gap-2">
        Send to Lab <span class="text-xl">🚀</span>
      </button>
    </div>
  </div>

  <!-- Main Camera UI -->
  <main class="glass-panel w-full max-w-md rounded-3xl p-6 flex flex-col items-center relative overflow-hidden">
    
    <!-- Header -->
    <div class="w-full flex justify-between items-center mb-6">
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-800">CABBIE CAM <span class="text-orange-500">⚡️</span></h1>
      <div class="bg-white px-4 py-1.5 rounded-xl text-sm font-bold border-2 border-slate-100 text-slate-600 shadow-sm">
        <span id="shotsLeft" class="text-teal-500 text-base font-extrabold">5</span> Left
      </div>
    </div>

    <!-- Live Viewfinder -->
    <div class="w-full aspect-[3/4] md:aspect-square bg-slate-900 rounded-2xl mb-5 border-[6px] border-white shadow-[0_4px_15px_rgba(0,0,0,0.1)] flex flex-col justify-center items-center relative overflow-hidden">
      
      <!-- The Live Camera Feed -->
      <video id="cameraPreview" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover z-0"></video>

      <!-- Viewfinder Flash -->
      <div id="flashOverlay" class="absolute inset-0 bg-white z-50 opacity-0 pointer-events-none transition-opacity duration-[50ms]"></div>

      <!-- Camera Flip Button -->
      <button id="flipCamBtn" class="absolute top-3 right-3 z-30 bg-white/90 p-2.5 rounded-full border border-slate-200 backdrop-blur-md shadow-lg text-slate-800 transition hover:bg-white active:scale-90">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
      </button>

      <!-- Cool Grid Overlay -->
      <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:20px_20px] z-10 pointer-events-none"></div>
      
      <!-- Center Reticle -->
      <div class="w-16 h-16 border-2 border-white/40 rounded-full flex items-center justify-center relative z-20 pointer-events-none">
        <div id="recordingDot" class="w-3 h-3 bg-red-500 rounded-full shadow-[0_0_12px_rgba(239,68,68,0.9)] animate-pulse hidden"></div>
      </div>
      
      <!-- Video Progress Bar -->
      <div id="progressBar" class="absolute bottom-0 left-0 h-2 bg-orange-500 z-20 w-0 transition-all duration-[15000ms] ease-linear"></div>
    </div>
    
    <p id="statusText" class="mb-5 text-slate-500 text-sm font-bold uppercase tracking-widest h-5 transition-transform">Connecting...</p>

    <!-- Vibrant Shutter Button -->
    <button id="shutterBtn" class="shutter-pop w-24 h-24 bg-white rounded-full border-[4px] border-slate-100 shadow-[0_8px_20px_rgba(0,0,0,0.1)] flex items-center justify-center mb-6 relative overflow-hidden group">
      <div id="shutterInner" class="w-20 h-20 bg-gradient-to-br from-orange-400 to-red-500 rounded-full group-active:scale-95 transition-all flex items-center justify-center shadow-inner">
        <img src="https://i.imgur.com/p2qZOL5.png" alt="CAB Logo" class="w-12 h-12 object-contain opacity-100 drop-shadow-md pointer-events-none" />
      </div>
    </button>

    <!-- Mode Toggle -->
    <div class="flex bg-white rounded-full p-1.5 border-2 border-slate-100 shadow-sm">
      <button id="modePhoto" class="toggle-active px-6 py-2.5 rounded-full text-sm font-bold transition-all">Photo</button>
      <button id="modeVideo" class="text-slate-500 hover:text-slate-800 px-6 py-2.5 rounded-full text-sm font-bold transition-all">Video (15s)</button>
    </div>

  </main>

  <!-- Gallery/Reveal Section -->
  <section id="gallerySection" class="hidden w-full max-w-md mt-8 pb-12">
    <div class="glass-panel rounded-3xl p-6 text-center">
      <h2 class="text-3xl font-extrabold mb-1 text-slate-800">The Vault is Open 🔓</h2>
      <p class="text-slate-500 font-semibold mb-8 text-sm">End of Year Memories</p>
      <div id="photoGrid" class="grid grid-cols-2 gap-4"></div>
    </div>
  </section>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- App Logic -->
  <script>
    const supabaseUrl = 'https://nmmshjdknmuzpgpquwec.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tbXNoamRrbm11enBncHF1d2VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMTk5MTIsImV4cCI6MjA4NjY5NTkxMn0.5uv8Q93mg_Gg3rH9gVpl1d9W6uEsySLL5hu5pdBtJNE';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const cameraPreview = document.getElementById('cameraPreview');
    const shutterBtn = document.getElementById('shutterBtn');
    const shutterInner = document.getElementById('shutterInner');
    const shotsLeftEl = document.getElementById('shotsLeft');
    const statusText = document.getElementById('statusText');
    const modePhoto = document.getElementById('modePhoto');
    const modeVideo = document.getElementById('modeVideo');
    const gallerySection = document.getElementById('gallerySection');
    const photoGrid = document.getElementById('photoGrid');
    const recordingDot = document.getElementById('recordingDot');
    const progressBar = document.getElementById('progressBar');
    const flipCamBtn = document.getElementById('flipCamBtn');
    
    // Modal Elements
    const noteModal = document.getElementById('noteModal');
    const modalNoteInput = document.getElementById('modalNoteInput');
    const sendToLabBtn = document.getElementById('sendToLabBtn');

    const DAILY_LIMIT = 5;
    let currentMode = 'image';
    let stream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recordingTimeout = null;
    let currentFacingMode = 'environment'; 
    
    // Temporary storage for the file before sending
    let pendingFile = null;
    let pendingMediaType = null;

    // --- Device ID Generator ---
    function getDeviceId() {
      let id = localStorage.getItem('cabbie_device_id');
      if (!id) {
        id = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        localStorage.setItem('cabbie_device_id', id);
      }
      return id;
    }
    const deviceId = getDeviceId();

    // --- Fun Effects ---
    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function spawnEmojis() {
      const emojis = ['📸', '⚡️', '💥', '✌️', '🔥', '🎞️'];
      const main = document.querySelector('main');
      
      for(let i=0; i<5; i++) {
        const el = document.createElement('div');
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        el.className = 'absolute text-3xl pointer-events-none z-50';
        el.style.left = `calc(50% + ${(Math.random() - 0.5) * 80}px)`;
        el.style.bottom = '110px';
        el.style.transition = 'all 1s cubic-bezier(0.25, 1, 0.5, 1)';
        el.style.transform = `translateY(0) scale(0.5) rotate(${Math.random() * 40 - 20}deg)`;
        el.style.opacity = '1';
        
        main.appendChild(el);
        
        requestAnimationFrame(() => {
          el.style.transform = `translateY(-${Math.random() * 150 + 100}px) scale(1.5) rotate(${Math.random() * 90 - 45}deg)`;
          el.style.opacity = '0';
        });
        
        setTimeout(() => el.remove(), 1000);
      }
    }

    function bounceText(text) {
      statusText.innerText = text;
      statusText.style.transform = 'scale(1.1)';
      setTimeout(() => statusText.style.transform = 'scale(1)', 150);
    }

    // --- Camera Initialization & Flipping ---
    async function startCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: currentFacingMode },
          audio: true 
        });
        cameraPreview.srcObject = stream;
        
        if (currentFacingMode === 'user') {
          cameraPreview.style.transform = 'scaleX(-1)';
        } else {
          cameraPreview.style.transform = 'scaleX(1)';
        }
        
        bounceText(currentMode === 'image' ? "READY TO SNAP 📸" : "READY FOR VIDEO ⚡️");
      } catch (err) {
        console.error("Camera access error:", err);
        bounceText("CAMERA PERMISSIONS REQUIRED!");
        shutterBtn.disabled = true;
      }
    }

    flipCamBtn.addEventListener('click', () => {
      if(isRecording) return;
      triggerHaptic();
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    // --- Mode Toggles ---
    modePhoto.addEventListener('click', () => {
      if(isRecording) return;
      triggerHaptic();
      currentMode = 'image';
      modePhoto.classList.add('toggle-active');
      modePhoto.classList.remove('text-slate-500', 'hover:text-slate-800');
      modeVideo.classList.remove('toggle-active');
      modeVideo.classList.add('text-slate-500', 'hover:text-slate-800');
      
      shutterInner.classList.replace('from-rose-500', 'from-orange-400');
      shutterInner.classList.replace('to-rose-700', 'to-red-500');
      
      bounceText("READY TO SNAP 📸");
      recordingDot.classList.add('hidden');
    });

    modeVideo.addEventListener('click', () => {
      if(isRecording) return;
      triggerHaptic();
      currentMode = 'video';
      modeVideo.classList.add('toggle-active');
      modeVideo.classList.remove('text-slate-500', 'hover:text-slate-800');
      modePhoto.classList.remove('toggle-active');
      modePhoto.classList.add('text-slate-500', 'hover:text-slate-800');
      
      shutterInner.classList.replace('from-orange-400', 'from-rose-500');
      shutterInner.classList.replace('to-red-500', 'to-rose-700');
      
      bounceText("READY FOR VIDEO ⚡️");
      recordingDot.classList.remove('hidden');
    });

    // --- Media Capture & Upload ---
    shutterBtn.addEventListener('click', () => {
      if (shutterBtn.disabled) return;
      triggerHaptic();

      if (currentMode === 'image') capturePhoto();
      else {
        if (!isRecording) startRecording();
        else stopRecording();
      }
    });

    function showNoteModal() {
      noteModal.classList.remove('hidden');
      setTimeout(() => modalNoteInput.focus(), 100);
    }

    sendToLabBtn.addEventListener('click', () => {
      const note = modalNoteInput.value.trim();
      noteModal.classList.add('hidden');
      modalNoteInput.value = ''; // clear for next time
      
      bounceText("SENDING TO LAB... 📦");
      uploadFileToSupabase(pendingFile, pendingMediaType, note);
    });

    function capturePhoto() {
      const flash = document.getElementById('flashOverlay');
      if(flash) {
        flash.style.opacity = '1';
        setTimeout(() => { flash.style.opacity = '0'; }, 60); 
      }
      
      spawnEmojis();
      shutterBtn.disabled = true;

      const canvas = document.createElement('canvas');
      canvas.width = cameraPreview.videoWidth;
      canvas.height = cameraPreview.videoHeight;
      const ctx = canvas.getContext('2d');
      
      if (currentFacingMode === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(cameraPreview, 0, 0, canvas.width, canvas.height);
      
      canvas.toBlob((blob) => {
        pendingFile = new File([blob], `photo_${Date.now()}.jpg`, { type: "image/jpeg" });
        pendingMediaType = 'image';
        showNoteModal(); // Pop up the note dialog instead of auto-uploading
      }, 'image/jpeg', 0.9);
    }

    function startRecording() {
      recordedChunks = [];
      try {
        const mimeType = MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : 'video/mp4';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream); 
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blobType = recordedChunks[0]?.type || 'video/mp4';
        const blob = new Blob(recordedChunks, { type: blobType });
        const ext = blobType.includes('webm') ? 'webm' : 'mp4';
        
        pendingFile = new File([blob], `video_${Date.now()}.${ext}`, { type: blobType });
        pendingMediaType = 'video';
        showNoteModal(); // Pop up the note dialog
      };

      mediaRecorder.start();
      isRecording = true;
      
      bounceText("RECORDING... TAP TO STOP 🔴");
      shutterInner.classList.add('animate-pulse');
      progressBar.style.width = '100%'; 

      recordingTimeout = setTimeout(() => {
        if (isRecording) stopRecording();
      }, 15000);
    }

    function stopRecording() {
      if(mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      clearTimeout(recordingTimeout);
      
      shutterBtn.disabled = true;
      shutterInner.classList.remove('animate-pulse');
      progressBar.style.width = '0px'; 
      progressBar.style.transition = 'none'; 
      setTimeout(() => { progressBar.style.transition = 'all 15000ms ease-linear'; }, 50);
    }

    async function uploadFileToSupabase(file, mediaType, note) {
      try {
        const fileName = `${deviceId}-${Date.now()}-${file.name}`;
        
        const { error: uploadError } = await supabaseClient.storage
          .from('disposable_snaps')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = supabaseClient.storage
          .from('disposable_snaps')
          .getPublicUrl(fileName);

        const { error: insertError } = await supabaseClient.from('photos').insert([
          { 
            user_id: deviceId, 
            image_url: publicUrlData.publicUrl,
            media_type: mediaType,
            note: note
          }
        ]);

        if (insertError) throw insertError;

        bounceText("SENT OFF FOR DEVELOPMENT! 🎞️");
        
        setTimeout(() => {
          shutterBtn.disabled = false;
          bounceText(currentMode === 'image' ? "READY TO SNAP 📸" : "READY FOR VIDEO ⚡️");
          init(); 
        }, 2000); 

      } catch (error) {
        console.error('Upload failed:', error);
        bounceText("ERROR SENDING TO LAB! ⚠️");
        shutterBtn.disabled = false;
      }
    }

    // --- App Init ---
    async function init() {
      const { data: settings } = await supabaseClient.from('app_settings').select('is_revealed').eq('id', 1).single();

      if (settings && settings.is_revealed) {
        shutterBtn.disabled = true;
        flipCamBtn.classList.add('hidden');
        bounceText("DEVELOPMENT FINISHED! 📸");
        if(stream) stream.getTracks().forEach(track => track.stop()); 
        showGallery(); 
        return;
      }

      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);

      const { count } = await supabaseClient
        .from('photos')
        .select('*', { count: 'exact', head: true })
        .eq('user_id', deviceId)
        .gte('created_at', startOfDay.toISOString());

      const shotsLeft = DAILY_LIMIT - (count || 0);
      shotsLeftEl.innerText = shotsLeft;

      if (shotsLeft <= 0) {
        shutterBtn.disabled = true;
        flipCamBtn.classList.add('hidden');
        bounceText("OUT OF FILM TODAY! 🏁");
        if(stream) stream.getTracks().forEach(track => track.stop());
      } else if (!stream) {
        startCamera();
      }
    }

    // --- Gallery Logic ---
    async function showGallery() {
      gallerySection.classList.remove('hidden');
      
      const { data: vaultMedia, error } = await supabaseClient
        .from('photos')
        .select('image_url, media_type, created_at, note')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Error fetching the vault:", error);
        return;
      }

      photoGrid.innerHTML = vaultMedia.map(media => {
        const dateStr = new Date(media.created_at).toLocaleDateString();
        const noteHtml = media.note ? `<p class="text-sm font-bold text-slate-800 mt-2 text-center leading-tight">"${media.note}"</p>` : '';
        
        if (media.media_type === 'video') {
          return `
            <div class="polaroid-scatter polaroid-card cursor-pointer flex flex-col items-center">
              <div class="relative w-full">
                <div class="absolute top-2 right-2 bg-red-500 w-3 h-3 rounded-full shadow-[0_0_8px_rgba(239,68,68,0.8)] z-10"></div>
                <video src="${media.image_url}" class="w-full h-auto rounded-md object-cover aspect-[3/4] bg-slate-100 disposable-filter" autoplay loop muted playsinline></video>
              </div>
              ${noteHtml}
              <p class="text-xs text-slate-400 font-bold mt-2">${dateStr}</p>
            </div>
          `;
        } else {
          return `
            <div class="polaroid-scatter polaroid-card cursor-pointer flex flex-col items-center">
              <img src="${media.image_url}" class="w-full h-auto rounded-md object-cover aspect-[3/4] bg-slate-100 disposable-filter" loading="lazy" />
              ${noteHtml}
              <p class="text-xs text-slate-400 font-bold mt-2">${dateStr}</p>
            </div>
          `;
        }
      }).join('');
    }

    init();
  </script>
</body>
</html>
