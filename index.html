<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Forces iOS Safari to keep the status bars dark -->
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>CABBIE CAM 📸</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Mono', monospace;
      background-color: #050505;
      color: #f8fafc;
      overflow-x: hidden; 
      position: relative;
    }

    /* Animated Breathing Glows */
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.8; }
      50% { transform: translateY(-20px) scale(1.1); opacity: 1; }
    }

    .bg-glow-purple {
      position: absolute;
      top: 10%;
      left: 10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(0,0,0,0) 70%);
      filter: blur(40px);
      z-index: -1;
      animation: float 6s ease-in-out infinite;
    }
    .bg-glow-blue {
      position: absolute;
      bottom: 10%;
      right: 10%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, rgba(0,0,0,0) 70%);
      filter: blur(40px);
      z-index: -1;
      animation: float 8s ease-in-out infinite reverse;
    }

    /* Deep Black Frosted Effect */
    .glass-panel {
      background: rgba(20, 20, 22, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .toggle-active {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .disposable-filter {
      filter: contrast(1.25) saturate(1.2) sepia(0.2) brightness(0.9) hue-rotate(-5deg);
    }

    .film-overlay {
      position: relative;
      overflow: hidden;
    }
    .film-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.7); 
      background: radial-gradient(circle at top right, rgba(255, 120, 0, 0.15) 0%, rgba(0,0,0,0) 60%);
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 5;
      border-radius: 0.5rem; 
    }

    .polaroid-scatter:nth-child(odd) {
      transform: rotate(-3deg);
      transition: transform 0.3s ease;
    }
    .polaroid-scatter:nth-child(even) {
      transform: rotate(4deg);
      transition: transform 0.3s ease;
    }
    .polaroid-scatter:hover {
      transform: rotate(0deg) scale(1.05);
      z-index: 20;
    }

    .shutter-pop:active {
      transform: scale(0.85);
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tag-input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    /* Retro Viewfinder Scanline */
    .scanline {
      width: 100%;
      height: 6px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.2), rgba(255,255,255,0));
      position: absolute;
      top: 0;
      animation: scan 3s linear infinite;
      z-index: 15;
      pointer-events: none;
    }
    @keyframes scan {
      0% { top: -10%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 110%; opacity: 0; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Ambient Glows -->
  <div class="bg-glow-purple"></div>
  <div class="bg-glow-blue"></div>

  <!-- Main Camera UI -->
  <main class="glass-panel w-full max-w-md rounded-[2rem] p-6 flex flex-col items-center relative overflow-hidden">
    
    <!-- Header -->
    <div class="w-full flex justify-between items-center mb-6">
      <h1 class="text-xl font-bold tracking-wider text-white">CABBIE CAM</h1>
      <div class="glass-panel px-4 py-1.5 rounded-full text-sm font-bold border border-white/5 uppercase tracking-wider">
        <span id="shotsLeft" class="text-purple-400">5</span> Left
      </div>
    </div>

    <!-- Live Viewfinder -->
    <div class="w-full aspect-[3/4] md:aspect-square bg-black rounded-2xl mb-4 border border-white/5 shadow-inner flex flex-col justify-center items-center relative overflow-hidden">
      
      <!-- The Live Camera Feed -->
      <video id="cameraPreview" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover z-0"></video>

      <!-- Viewfinder Flash (Trapped inside the viewfinder to fix Safari bug!) -->
      <div id="flashOverlay" class="absolute inset-0 bg-white z-50 opacity-0 pointer-events-none transition-opacity duration-[50ms]"></div>

      <!-- Camera Flip Button -->
      <button id="flipCamBtn" class="absolute top-3 right-3 z-30 bg-black/50 p-2 rounded-full border border-white/20 backdrop-blur-md transition active:scale-90">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-white">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
      </button>

      <!-- Retro Scanline & Grid -->
      <div class="scanline"></div>
      <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px] z-10 pointer-events-none"></div>
      
      <!-- Reticle -->
      <div class="w-16 h-16 border-2 border-white/20 rounded-full flex items-center justify-center relative z-20 pointer-events-none">
        <div class="w-0.5 h-3 bg-white/40 absolute top-[-8px]"></div>
        <div class="w-0.5 h-3 bg-white/40 absolute bottom-[-8px]"></div>
        <div class="w-3 h-0.5 bg-white/40 absolute left-[-8px]"></div>
        <div class="w-3 h-0.5 bg-white/40 absolute right-[-8px]"></div>
        <div id="recordingDot" class="w-1 h-1 bg-red-500 rounded-full shadow-[0_0_12px_rgba(239,68,68,1)] animate-pulse hidden"></div>
      </div>
      
      <!-- Video Progress Bar -->
      <div id="progressBar" class="absolute bottom-0 left-0 h-1.5 bg-red-500 z-20 w-0 transition-all duration-[15000ms] ease-linear"></div>
    </div>
    
    <p id="statusText" class="mb-4 text-white/50 text-sm tracking-widest uppercase text-center px-4 font-bold h-5 transition-transform">Connecting to lens...</p>

    <!-- Note Input -->
    <input type="text" id="photoNote" maxlength="40" placeholder="Add a note... (optional)" class="tag-input w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 mb-6 text-sm text-center text-white focus:outline-none focus:border-purple-500/50 shadow-inner transition-colors">

    <!-- Shutter Button -->
    <button id="shutterBtn" class="shutter-pop w-24 h-24 bg-neutral-900 rounded-full border-2 border-white/10 shadow-[0_0_25px_rgba(168,85,247,0.3)] flex items-center justify-center mb-6 relative overflow-hidden group">
      <div id="shutterInner" class="w-20 h-20 bg-gradient-to-br from-neutral-700 to-neutral-900 rounded-full border border-white/10 group-active:from-neutral-800 group-active:to-neutral-950 transition-colors flex items-center justify-center">
        <img src="https://i.imgur.com/p2qZOL5.png" alt="CAB Logo" class="w-12 h-12 object-contain opacity-90 drop-shadow-lg pointer-events-none" />
      </div>
    </button>

    <!-- Mode Toggle -->
    <div class="flex bg-black/60 rounded-full p-1.5 border border-white/10 shadow-inner">
      <button id="modePhoto" class="toggle-active px-5 py-2 rounded-full text-xs font-bold tracking-widest uppercase transition-all">Photo</button>
      <button id="modeVideo" class="text-white/40 px-5 py-2 rounded-full text-xs font-bold tracking-widest uppercase transition-all">Video (15s)</button>
    </div>

  </main>

  <!-- Gallery/Reveal Section -->
  <section id="gallerySection" class="hidden w-full max-w-md mt-8 pb-12">
    <div class="glass-panel rounded-[2rem] p-6 text-center">
      <h2 class="text-2xl font-bold mb-2 text-white tracking-wider uppercase">The Vault is Open 🔓</h2>
      <p class="text-white/40 text-xs mb-8 uppercase tracking-widest">End of Year Memories</p>
      <div id="photoGrid" class="grid grid-cols-2 gap-4"></div>
    </div>
  </section>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- App Logic -->
  <script>
    const supabaseUrl = 'https://nmmshjdknmuzpgpquwec.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tbXNoamRrbm11enBncHF1d2VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMTk5MTIsImV4cCI6MjA4NjY5NTkxMn0.5uv8Q93mg_Gg3rH9gVpl1d9W6uEsySLL5hu5pdBtJNE';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const cameraPreview = document.getElementById('cameraPreview');
    const shutterBtn = document.getElementById('shutterBtn');
    const shutterInner = document.getElementById('shutterInner');
    const shotsLeftEl = document.getElementById('shotsLeft');
    const statusText = document.getElementById('statusText');
    const modePhoto = document.getElementById('modePhoto');
    const modeVideo = document.getElementById('modeVideo');
    const gallerySection = document.getElementById('gallerySection');
    const photoGrid = document.getElementById('photoGrid');
    const recordingDot = document.getElementById('recordingDot');
    const progressBar = document.getElementById('progressBar');
    const flipCamBtn = document.getElementById('flipCamBtn');
    const photoNote = document.getElementById('photoNote');

    const DAILY_LIMIT = 5;
    let currentMode = 'image';
    let stream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recordingTimeout = null;
    let currentFacingMode = 'environment'; 

    // --- Device ID Generator ---
    function getDeviceId() {
      let id = localStorage.getItem('cabbie_device_id');
      if (!id) {
        id = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        localStorage.setItem('cabbie_device_id', id);
      }
      return id;
    }
    const deviceId = getDeviceId();

    // --- Fun Effects ---
    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function spawnEmojis() {
      const emojis = ['📸', '✨', '🎞️', '💜'];
      const main = document.querySelector('main');
      
      for(let i=0; i<4; i++) {
        const el = document.createElement('div');
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        el.className = 'absolute text-3xl pointer-events-none z-50';
        el.style.left = `calc(50% + ${(Math.random() - 0.5) * 80}px)`;
        el.style.bottom = '110px';
        el.style.transition = 'all 1s cubic-bezier(0.25, 1, 0.5, 1)';
        el.style.transform = `translateY(0) scale(0.5) rotate(${Math.random() * 40 - 20}deg)`;
        el.style.opacity = '1';
        
        main.appendChild(el);
        
        // Trigger float up animation
        requestAnimationFrame(() => {
          el.style.transform = `translateY(-${Math.random() * 150 + 100}px) scale(1.5) rotate(${Math.random() * 90 - 45}deg)`;
          el.style.opacity = '0';
        });
        
        setTimeout(() => el.remove(), 1000);
      }
    }

    function bounceText(text) {
      statusText.innerText = text;
      statusText.style.transform = 'scale(1.1)';
      setTimeout(() => statusText.style.transform = 'scale(1)', 150);
    }

    // --- Camera Initialization & Flipping ---
    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: currentFacingMode },
          audio: true 
        });
        cameraPreview.srcObject = stream;
        
        if (currentFacingMode === 'user') {
          cameraPreview.style.transform = 'scaleX(-1)';
        } else {
          cameraPreview.style.transform = 'scaleX(1)';
        }
        
        bounceText(currentMode === 'image' ? "Say Cheese ✨" : "Ready for Video (Max 15s)");
      } catch (err) {
        console.error("Camera access error:", err);
        bounceText("Camera permissions required!");
        shutterBtn.disabled = true;
      }
    }

    flipCamBtn.addEventListener('click', () => {
      if(isRecording) return;
      triggerHaptic();
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    // --- Mode Toggles ---
    modePhoto.addEventListener('click', () => {
      if(isRecording) return;
      triggerHaptic();
      currentMode = 'image';
      modePhoto.classList.add('toggle-active');
      modePhoto.classList.remove('text-white/40');
      modeVideo.classList.remove('toggle-active');
      modeVideo.classList.add('text-white/40');
      shutterInner.classList.replace('from-red-900', 'from-neutral-700'); 
      bounceText("Say Cheese ✨");
      recordingDot.classList.add('hidden');
    });

    modeVideo.addEventListener('click', () => {
      if(isRecording) return;
      triggerHaptic();
      currentMode = 'video';
      modeVideo.classList.add('toggle-active');
      modeVideo.classList.remove('text-white/40');
      modePhoto.classList.remove('toggle-active');
      modePhoto.classList.add('text-white/40');
      shutterInner.classList.replace('from-neutral-700', 'from-red-900'); 
      bounceText("Ready for Video (Max 15s)");
      recordingDot.classList.remove('hidden');
    });

    // --- Media Capture & Upload ---
    shutterBtn.addEventListener('click', () => {
      if (shutterBtn.disabled) return;
      triggerHaptic();

      if (currentMode === 'image') {
        capturePhoto();
      } else {
        if (!isRecording) startRecording();
        else stopRecording();
      }
    });

    function capturePhoto() {
      // Trigger new constrained flash
      const flash = document.getElementById('flashOverlay');
      if(flash) {
        flash.style.opacity = '1';
        setTimeout(() => { flash.style.opacity = '0'; }, 80); // Faster, punchier flash
      }
      
      spawnEmojis();

      const canvas = document.createElement('canvas');
      canvas.width = cameraPreview.videoWidth;
      canvas.height = cameraPreview.videoHeight;
      const ctx = canvas.getContext('2d');
      
      if (currentFacingMode === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(cameraPreview, 0, 0, canvas.width, canvas.height);
      
      bounceText("Developing... 🎞️");
      shutterBtn.disabled = true;

      canvas.toBlob((blob) => {
        const file = new File([blob], `photo_${Date.now()}.jpg`, { type: "image/jpeg" });
        uploadFileToSupabase(file, 'image', photoNote.value.trim());
      }, 'image/jpeg', 0.9);
    }

    function startRecording() {
      recordedChunks = [];
      try {
        const mimeType = MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : 'video/mp4';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream); 
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        bounceText("Processing Video... 📼");
        const blobType = recordedChunks[0]?.type || 'video/mp4';
        const blob = new Blob(recordedChunks, { type: blobType });
        const ext = blobType.includes('webm') ? 'webm' : 'mp4';
        const file = new File([blob], `video_${Date.now()}.${ext}`, { type: blobType });
        
        uploadFileToSupabase(file, 'video', photoNote.value.trim());
      };

      mediaRecorder.start();
      isRecording = true;
      
      bounceText("Recording... Tap to stop");
      shutterInner.classList.add('bg-red-600', 'animate-pulse');
      progressBar.style.width = '100%'; 

      recordingTimeout = setTimeout(() => {
        if (isRecording) stopRecording();
      }, 15000);
    }

    function stopRecording() {
      if(mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      clearTimeout(recordingTimeout);
      
      shutterBtn.disabled = true;
      shutterInner.classList.remove('bg-red-600', 'animate-pulse');
      progressBar.style.width = '0px'; 
      progressBar.style.transition = 'none'; 
      setTimeout(() => { progressBar.style.transition = 'all 15000ms ease-linear'; }, 50);
    }

    async function uploadFileToSupabase(file, mediaType, note) {
      try {
        const fileName = `${deviceId}-${Date.now()}-${file.name}`;
        
        const { data: uploadData, error: uploadError } = await supabaseClient.storage
          .from('disposable_snaps')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = supabaseClient.storage
          .from('disposable_snaps')
          .getPublicUrl(fileName);

        const { error: insertError } = await supabaseClient.from('photos').insert([
          { 
            user_id: deviceId, 
            image_url: publicUrlData.publicUrl,
            media_type: mediaType,
            note: note
          }
        ]);

        if (insertError) throw insertError;

        bounceText("Saved to the vault! 🔒");
        photoNote.value = ''; 
        
        setTimeout(() => {
          shutterBtn.disabled = false;
          bounceText(currentMode === 'image' ? "Say Cheese ✨" : "Ready for Video (Max 15s)");
          init(); 
        }, 2000); 

      } catch (error) {
        console.error('Upload failed:', error);
        bounceText("Error saving. Try again.");
        shutterBtn.disabled = false;
      }
    }

    // --- App Init ---
    async function init() {
      const { data: settings } = await supabaseClient.from('app_settings').select('is_revealed').eq('id', 1).single();

      if (settings && settings.is_revealed) {
        shutterBtn.disabled = true;
        photoNote.disabled = true;
        flipCamBtn.classList.add('hidden');
        bounceText("Camera locked. The vault is open!");
        if(stream) stream.getTracks().forEach(track => track.stop()); 
        showGallery(); 
        return;
      }

      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);

      const { count } = await supabaseClient
        .from('photos')
        .select('*', { count: 'exact', head: true })
        .eq('user_id', deviceId)
        .gte('created_at', startOfDay.toISOString());

      const shotsLeft = DAILY_LIMIT - (count || 0);
      shotsLeftEl.innerText = shotsLeft;

      if (shotsLeft <= 0) {
        shutterBtn.disabled = true;
        photoNote.disabled = true;
        flipCamBtn.classList.add('hidden');
        bounceText("Out of film for today!");
        if(stream) stream.getTracks().forEach(track => track.stop());
      } else if (!stream) {
        startCamera();
      }
    }

    // --- Gallery Logic ---
    async function showGallery() {
      gallerySection.classList.remove('hidden');
      
      const { data: vaultMedia, error } = await supabaseClient
        .from('photos')
        .select('image_url, media_type, created_at, note')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Error fetching the vault:", error);
        return;
      }

      photoGrid.innerHTML = vaultMedia.map(media => {
        const dateStr = new Date(media.created_at).toLocaleDateString();
        const noteHtml = media.note ? `<p class="text-sm font-bold text-white mb-1 tracking-wide">"${media.note}"</p>` : '';
        
        if (media.media_type === 'video') {
          return `
            <div class="polaroid-scatter cursor-pointer glass-panel p-2 rounded-xl relative border border-white/5 bg-white/5 flex flex-col items-center">
              <div class="absolute top-4 right-4 bg-red-500 w-2 h-2 rounded-full shadow-[0_0_8px_rgba(239,68,68,1)] z-10"></div>
              <div class="film-overlay rounded-lg w-full mb-3">
                <video src="${media.image_url}" class="w-full h-auto rounded-lg object-cover aspect-[3/4] bg-black/40 disposable-filter" autoplay loop muted playsinline></video>
              </div>
              ${noteHtml}
              <p class="text-xs text-white/40 uppercase tracking-wider">${dateStr}</p>
            </div>
          `;
        } else {
          return `
            <div class="polaroid-scatter cursor-pointer glass-panel p-2 rounded-xl border border-white/5 bg-white/5 flex flex-col items-center">
              <div class="film-overlay rounded-lg w-full mb-3">
                <img src="${media.image_url}" class="w-full h-auto rounded-lg object-cover aspect-[3/4] bg-black/40 disposable-filter" loading="lazy" />
              </div>
              ${noteHtml}
              <p class="text-xs text-white/40 uppercase tracking-wider">${dateStr}</p>
            </div>
          `;
        }
      }).join('');
    }

    init();
  </script>
</body>
</html>
