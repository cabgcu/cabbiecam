<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABBIE CAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Mono', monospace;
      background-color: #050505;
      color: #f8fafc;
      overflow-x: hidden; 
      position: relative;
    }

    /* Ambient Background Glows */
    .bg-glow-purple {
      position: absolute;
      top: 10%;
      left: 10%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(0,0,0,0) 70%);
      filter: blur(40px);
      z-index: -1;
    }
    .bg-glow-blue {
      position: absolute;
      bottom: 10%;
      right: 10%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(0,0,0,0) 70%);
      filter: blur(40px);
      z-index: -1;
    }

    /* Deep Black Frosted Effect */
    .glass-panel {
      background: rgba(20, 20, 22, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* Toggle switch active state */
    .toggle-active {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    /* Disposable Camera Image Filter */
    .disposable-filter {
      filter: contrast(1.25) saturate(1.2) sepia(0.2) brightness(0.9) hue-rotate(-5deg);
    }

    /* Vignette & Light Leak Overlay */
    .film-overlay {
      position: relative;
      overflow: hidden;
    }
    .film-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.7); 
      background: radial-gradient(circle at top right, rgba(255, 120, 0, 0.15) 0%, rgba(0,0,0,0) 60%);
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 5;
      border-radius: 0.5rem; 
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Ambient Glows -->
  <div class="bg-glow-purple"></div>
  <div class="bg-glow-blue"></div>

  <!-- Main Camera UI -->
  <main class="glass-panel w-full max-w-md rounded-[2rem] p-6 flex flex-col items-center relative overflow-hidden">
    
    <!-- Header -->
    <div class="w-full flex justify-between items-center mb-8">
      <h1 class="text-xl font-bold tracking-wider text-white">CABBIE CAM</h1>
      <div class="glass-panel px-4 py-1.5 rounded-full text-sm font-bold border border-white/5 uppercase tracking-wider">
        <span id="shotsLeft" class="text-purple-400">5</span> Left Today
      </div>
    </div>

    <!-- Viewfinder Placeholder -->
    <div class="w-full aspect-square bg-black/60 rounded-2xl mb-8 border border-white/5 shadow-inner flex flex-col justify-center items-center relative">
      <div class="w-16 h-16 border border-white/20 rounded-full flex items-center justify-center relative">
        <div class="w-0.5 h-3 bg-white/30 absolute top-[-6px]"></div>
        <div class="w-0.5 h-3 bg-white/30 absolute bottom-[-6px]"></div>
        <div class="w-3 h-0.5 bg-white/30 absolute left-[-6px]"></div>
        <div class="w-3 h-0.5 bg-white/30 absolute right-[-6px]"></div>
        <div class="w-1 h-1 bg-red-500/80 rounded-full shadow-[0_0_8px_rgba(239,68,68,1)]"></div>
      </div>
      <p id="statusText" class="mt-6 text-white/40 text-sm tracking-wide uppercase text-center px-4">Ready</p>
    </div>

    <!-- Hidden Native Inputs -->
    <input type="file" accept="image/*" capture="environment" id="photoInput" class="hidden" />
    <input type="file" accept="video/*" capture="environment" id="videoInput" class="hidden" />

    <!-- Shutter Button with CAB Logo -->
    <button id="shutterBtn" class="w-20 h-20 bg-neutral-900 rounded-full border border-white/10 shadow-[0_0_15px_rgba(0,0,0,0.8)] transition transform active:scale-95 flex items-center justify-center mb-6 relative overflow-hidden group">
      <div id="shutterInner" class="w-16 h-16 bg-gradient-to-br from-neutral-700 to-neutral-900 rounded-full border border-white/5 group-active:from-neutral-800 group-active:to-neutral-950 transition-colors flex items-center justify-center">
        <!-- The CAB Logo -->
        <img src="https://i.imgur.com/p2qZOL5.png" alt="CAB Logo" class="w-10 h-10 object-contain opacity-90 drop-shadow-md pointer-events-none" />
      </div>
    </button>

    <!-- Mode Toggle -->
    <div class="flex bg-black/50 rounded-full p-1 border border-white/5">
      <button id="modePhoto" class="toggle-active px-4 py-2 rounded-full text-xs font-bold tracking-widest uppercase transition-all">Photo</button>
      <button id="modeVideo" class="text-white/40 px-4 py-2 rounded-full text-xs font-bold tracking-widest uppercase transition-all">Video (15s)</button>
    </div>

  </main>

  <!-- Gallery/Reveal Section (Hidden by default) -->
  <section id="gallerySection" class="hidden w-full max-w-md mt-8 pb-12">
    <div class="glass-panel rounded-[2rem] p-6 text-center">
      <h2 class="text-2xl font-bold mb-6 text-white tracking-wider uppercase">The Vault</h2>
      <div id="photoGrid" class="grid grid-cols-2 gap-3">
        <!-- Media injected here via JS -->
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
